.document-head,.document-row{display:grid;grid-template-columns:minmax(0,1fr) 94px 92px 50px;gap:13px;align-items:center}
.document-head{font-size:10px;color:#93a088;padding:0 0 12px;border-bottom:1px solid #e8ede2}
.document-row{padding:16px 0;border-bottom:1px solid #edf0e8;font-size:10px;color:#88977d}
.document-row strong{font-size:12px;color:#4e6743;font-weight:550}
.document-row small{display:block;font-size:10px;margin-top:5px;color:#9ba78f}
.document-row .tag{justify-self:start;font-size:9px}
.document-row .btn{font-size:10px;padding:0 10px}
.document-upload{border:1px dashed #dce4d3;background:#f8faf4;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;margin-top:20px;color:#8fa17d;cursor:pointer}
.document-upload strong{font-size:11px;font-weight:500;color:#6e855b}
.document-upload span{font-size:9px;color:#9baa8c}
.health-folder{display:flex;align-items:center;gap:12px;padding:18px 0;width:100%;border-bottom:1px solid #e9eee3;text-align:left}
.health-folder>span:not(.mini-icon){flex:1}
.health-folder strong{display:block;font-size:12px;font-weight:550;color:#4d6842}
.health-folder small{display:block;color:#8e9f80;font-size:10px;margin-top:6px}
.health-folder>.icon{color:#91a382}
.health-lower{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;margin-top:16px}
.health-changes .card-title{margin-bottom:8px}
.change-line{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #edf0e7}
.change-line:last-child{border-bottom:0;padding-bottom:0}
.change-date{color:#97a58a;font-size:10px;width:58px}
.change-line strong{font-size:11px;color:#617850;font-weight:550}
.change-line p{font-size:10px;color:#95a586;margin-top:4px}
.change-line .tag{margin-left:auto;font-size:9px}
.health-storage h3{font-size:12px}
/* A working visibility preference belongs in settings. */
.module-layout{display:grid;grid-template-columns:minmax(0,1fr) 237px;gap:23px}
.module-card .side-note{font-size:12px}
.module-setting{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e7ece1;border-bottom:1px solid #e7ece1;padding:24px 0;gap:20px}
.module-setting h3{font-size:14px}
.module-setting p{font-size:11px;color:#819377;margin-top:6px}
.module-setting .mini-icon{width:43px;height:43px}
.module-setting .toggle{width:37px;height:22px}
.module-setting .toggle::after{width:16px;height:16px}
.module-setting .toggle.on::after{left:18px}
.module-explanation{display:flex;gap:10px;color:#91a082;align-items:flex-start;margin-top:20px}
.module-explanation p{font-size:11px;line-height:1.85}
.module-explanation .icon{margin-top:3px}
.nav-preview{background:#eef3e8;border:1px solid #e0e9d7;border-radius:13px;padding:23px 18px;align-self:start}
.nav-preview .eyebrow{font-size:9px;letter-spacing:1px}
.nav-preview-brand{display:flex;align-items:center;gap:10px;margin:25px 10px}
.nav-preview-brand .brand-mark{width:32px;height:32px;font-size:25px;border-radius:10px}
.nav-preview-brand strong{font-size:17px}
.nav-preview-item{display:flex;gap:11px;align-items:center;padding:12px 11px;border-radius:8px;color:#748b63;font-size:12px;margin:4px 0}
.nav-preview-item.selected{background:#204b38;color:#fff}
.nav-preview p{border-top:1px solid #dfe7d6;margin-top:25px;padding-top:15px;font-size:10px;color:#91a083;text-align:center}
.settings-nav button{padding:10px 12px}
.settings-nav .section-caption{padding-top:16px}
@media(min-width:1600px){.revision-three .content{padding:29px 42px}.archive-layout{grid-template-columns:290px minmax(0,1fr)}.archive-conversation{padding:28px 44px 20px}.archive-conversation .msg-text,.archive-conversation .message.user .bubble{font-size:15px}.personal-layout,.health-collection,.health-lower{grid-template-columns:minmax(0,1fr) 335px}}
@media(max-width:1190px){.revision-three .sidebar{width:175px}.revision-three .content{padding:22px}.archive-layout{grid-template-columns:235px minmax(0,1fr)}.archive-conversation{padding:22px}.personal-layout,.health-collection,.health-lower{grid-template-columns:minmax(0,1fr) 270px}.module-layout{grid-template-columns:minmax(0,1fr) 200px}.document-head,.document-row{grid-template-columns:minmax(0,1fr) 78px 80px 45px;gap:8px}}
@media(max-width:1000px){.personal-layout,.health-collection,.health-lower,.module-layout{grid-template-columns:1fr}.archive-layout{grid-template-columns:210px minmax(0,1fr)}.archive-context{display:none}.archive-footer{align-items:flex-start;flex-direction:column}.profile-description{align-items:flex-start}.document-head,.document-row{grid-template-columns:minmax(0,1fr) 90px 86px 45px}.nav-preview{display:none}}

function icon(name,size=18){return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.spark)+'</svg>';}
function btn(text,kind='',symbol=''){return '<button class="btn '+kind+'" data-preview="'+text+'">'+(symbol?icon(symbol,15):'')+text+'</button>';}
function tag(text,kind='',symbol=''){return '<span class="tag '+kind+'">'+(symbol?icon(symbol,11):'')+text+'</span>';}
function mini(name,kind=''){return '<span class="mini-icon '+kind+'">'+icon(name)+'</span>';}
function toggle(on=true){return '<button class="toggle '+(on?'on':'')+'" aria-label="切换示例开关" aria-pressed="'+on+'"></button>';}
function input(text,extra=''){return '<div class="input">'+text+(extra?icon(extra,14):'')+'</div>';}
function field(label,body,full=false){return '<div class="'+(full?'field-full':'')+'"><span class="label">'+label+'</span>'+body+'</div>';}
function cardTitle(title,extra='',sub=''){return '<div class="card-title"><div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+extra+'</div>';}
function link(text){return '<button class="section-link" data-preview="'+text+'">'+text+icon('chevron',13)+'</button>';}
function heading(title,subtitle,action='',kicker=''){return '<div class="page-heading"><div>'+(kicker?'<div class="eyebrow">'+kicker+'</div>':'')+'<h1>'+title+'</h1><p>'+subtitle+'</p></div>'+action+'</div>';}
function tabs(labels,active=0){return '<div class="subnav">'+labels.map((x,i)=>'<button class="'+(i===active?'selected':'')+'" data-preview="'+x.replace(/<[^>]+>/g,'').replace(/"/g,'&quot;')+'">'+x+'</button>').join('')+'</div>';}
function waveform(){return '<div class="wave">'+[5,9,14,8,18,24,15,9,20,26,17,12,22,16,8,12,6].map(h=>'<i style="--h:'+h+'px"></i>').join('')+'</div>';}

let toastTimer;
function toast(value) {
  const el=document.getElementById('preview-toast');
  el.textContent=value;el.classList.add('visible');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),2400);
}
function render() {
  let route = location.hash.slice(1) || 'chat';
  if (route === 'health') route = 'memory/health';
  const map = {
    chat:['chat','chat'], assistant:['assistant','assistant'], memory:['memory','memory'],
    'memory/experiences':['memory','experiences'], 'memory/health':['memory','health'],
    settings:['settings','settings'], 'settings/modules':['settings','modules'],
    devices:showDevices?['devices','devices']:['settings','modules']
  };
  const [page,view] = map[route] || map.chat;
  const label = navigation().find(x=>x[0]===page)?.[2] || '设置';
  document.title='豆梨 · '+label+' · 设计稿 03';
  document.getElementById('design').innerHTML='<div class="desktop revision-three" data-page="'+page+'" data-view="'+view+'"><div class="titlebar"><strong>豆梨</strong><span class="titlebar-note">DESIGN 03 · 设计预览 · 所有内容均为示例数据</span><div class="window-actions"><span>'+icon('minimize',11)+'</span><span>'+icon('maximize',11)+'</span><span>'+icon('x',11)+'</span></div></div><div class="workspace">'+layoutSidebar(page)+'<main class="main"><header class="topline"><div class="crumb">我的空间'+icon('chevron',11)+'<strong>'+label+'</strong></div><div class="top-tools"><span class="local">'+icon('lock',11)+'本机空间</span><button class="iconbtn" data-preview="全局搜索">'+icon('search',16)+'</button></div></header>'+pageContent[view]()+'</main></div></div>';
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>location.hash=el.dataset.go);
  document.querySelectorAll('[data-preview]').forEach(el=>el.onclick=()=>toast('「'+el.dataset.preview+'」入口示意 · 当前为设计预览'));
  document.querySelectorAll('.toggle:not(#devices-toggle)').forEach(el=>el.onclick=()=>{el.classList.toggle('on');el.setAttribute('aria-pressed',el.classList.contains('on'));});
  document.querySelectorAll('.chips .chip,.segmented button,.filter-pills button').forEach(el=>el.onclick=()=>{el.parentNode.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');});
  const switcher=document.getElementById('devices-toggle');
  if(switcher) switcher.onclick=()=>{
    showDevices=!showDevices;
    try { localStorage.setItem('douli-design-v3-devices',String(showDevices)); } catch {}
    render();
  };
  const search=document.getElementById('history-search');
  if(search) search.oninput=()=>{
    document.querySelectorAll('.archive-row').forEach(el=>el.hidden=!el.textContent.includes(search.value));
  };
  document.querySelectorAll('[data-history-title]').forEach(el=>el.onclick=()=>toast('「'+el.dataset.historyTitle+'」历史记录示例'));
}
addEventListener('hashchange',render);
addEventListener('keydown',event=>{
  if(event.target.matches('input,textarea'))return;
  if(/^[1-5]$/.test(event.key)&&navigation()[Number(event.key)-1])location.hash=navigation()[Number(event.key)-1][0];
});
render();
